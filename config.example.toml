# codomo-alerts settings
# Copy to config.toml (or run `codomo-alerts init`). Every option can also be set with
# a CODOMO_* environment variable, which wins over this file.

[search]
# countries = ["nl"]                  # nl, es, pt, at or names like "Spain". Empty = every country Codomo lists
cities = ["Eindhoven", "Rotterdam"]   # empty = every city. `codomo-alerts cities` lists names
# exclude_cities = ["Maastricht"]
bedrooms = ["studio", "1"]            # studio, 1, 2, 3, 4, or ranges like "2+" and "1-3"
# price_min = 600
price_max = 1600                      # euro per month, service costs included
contract = ["long"]                   # long, short, or a maximum: indefinite, 2y, 1y, 6m, 4m
# persons = 2                         # the home must fit this many people
# furnishing = ["furnished"]          # fully-furnished, furnished, semi-furnished, unfurnished
# move_in_before = "2027-02-01"
# gender = "female"                   # female or male: skip rooms Codomo keeps for the other gender only
interest = true                       # also tell me about register-interest homes (Codomo picks from a shortlist)

[notify]
# Any Apprise link: https://github.com/caronc/apprise/wiki
urls = [
  # "tgram://BOT_TOKEN/CHAT_ID",
  # "discord://WEBHOOK_ID/WEBHOOK_TOKEN",
  # "ntfy://a-long-secret-topic",
  # "mailtos://you:app-password@gmail.com",
]
# quiet_hours = "23:00-07:00"         # hold alerts, send what's still available afterwards
# existing_on_start = false           # on the very first run, also send what matches already
# digest_after = 4                    # more new homes than this at once become one message
# health = true                       # tell me when Codomo blocks us or changes

[schedule]
preset = "normal"                     # relaxed, normal or eager
# hot_seconds = 120                   # release hours: weekdays 08:30-18:00 and 00:05-00:45
# day_seconds = 300
# night_seconds = 900
# interest_seconds = 600              # register-interest homes have no deadline to race

[dashboard]
enabled = true
host = "127.0.0.1"                    # 0.0.0.0 to reach it from other devices
port = 8080
# password = "pick-one"               # basic auth, any user name

[general]
# data_dir = "~/.local/share/codomo-alerts"
# base_url = "https://codomo.eu"
# log_level = "INFO"
