name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  package:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install build && python -m build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
      - name: Build the holland2stay-alerts package (it only installs codomo-alerts)
        run: |
          version="${GITHUB_REF_NAME#v}"
          sed -i -E "s/^version = .*/version = \"$version\"/; s/codomo-alerts>=[0-9.]+/codomo-alerts>=$version/" \
            legacy/holland2stay-alerts/pyproject.toml
          python -m build legacy/holland2stay-alerts --outdir legacy-dist
      - uses: actions/upload-artifact@v7
        with:
          name: legacy-dist
          path: legacy-dist/
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        # a re-run finds the release already made and only replaces its files
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --title "$GITHUB_REF_NAME"
          fi

  pypi:
    # Turn on by setting the repository variable PUBLISH_PYPI to true after adding
    # this repo as a trusted publisher on pypi.org.
    if: vars.PUBLISH_PYPI == 'true'
    needs: package
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  pypi-legacy:
    # The old name on PyPI keeps working: holland2stay-alerts only installs codomo-alerts.
    # Needs this repo as a trusted publisher of the holland2stay-alerts project too.
    if: vars.PUBLISH_PYPI == 'true'
    needs: pypi
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: legacy-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
