# holland2stay-alerts on PyPI: only installs codomo-alerts, so the old name keeps working.
# The release workflow sets the version and the minimum codomo-alerts from the tag.

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "holland2stay-alerts"
version = "0.0.0"
description = "holland2stay-alerts is now codomo-alerts: alerts for new Codomo (formerly Holland2Stay) homes. Installing this installs codomo-alerts."
readme = "README.md"
license = "MIT"
authors = [{ name = "Koorosh Komeilizadeh" }]
requires-python = ">=3.11"
dependencies = ["codomo-alerts>=0.0.0"]
keywords = [
    "holland2stay",
    "holland2stay-alerts",
    "codomo",
    "codomo-alerts",
    "housing",
    "rental",
    "student-housing",
    "alerts",
    "notifications",
    "telegram",
    "netherlands",
    "granada",
    "lisbon",
    "linz",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://kooroshkz.github.io/codomo-alerts"
Source = "https://github.com/kooroshkz/codomo-alerts"
"New package" = "https://pypi.org/project/codomo-alerts/"

[project.scripts]
holland2stay-alerts = "holland2stay_alerts:main"
h2s-alerts = "holland2stay_alerts:main"

[tool.hatch.build.targets.wheel]
packages = ["src/holland2stay_alerts"]
