[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "codomo-alerts"
dynamic = ["version"]
description = "Self-hosted alerts for new Codomo homes (formerly Holland2Stay)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Koorosh Komeilizadeh" }]
requires-python = ">=3.11"
keywords = ["codomo", "holland2stay", "netherlands", "housing", "rental", "alerts", "self-hosted"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications",
    "Topic :: Utilities",
]
dependencies = [
    "apprise>=1.7",
    "requests>=2.31",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
mcp = ["mcp>=1.2"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.urls]
Homepage = "https://kooroshkz.github.io/codomo-alerts"
Source = "https://github.com/kooroshkz/codomo-alerts"
Issues = "https://github.com/kooroshkz/codomo-alerts/issues"

[project.scripts]
codomo-alerts = "codomo_alerts.cli:main"

[tool.hatch.version]
path = "src/codomo_alerts/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/codomo_alerts"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE", "config.example.toml"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
