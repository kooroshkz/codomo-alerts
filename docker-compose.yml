services:
  codomo-alerts:
    image: ghcr.io/kooroshkz/codomo-alerts:latest
    container_name: codomo-alerts
    restart: unless-stopped
    environment:
      CODOMO_CITIES: "Eindhoven, Rotterdam"
      CODOMO_BEDROOMS: "studio, 1"
      CODOMO_PRICE_MAX: "1600"
      CODOMO_NOTIFY: "tgram://BOT_TOKEN/CHAT_ID"
      # every country Codomo lists when cities and countries are empty; or one of them:
      # CODOMO_COUNTRIES: "nl"
      # Granada, Lisbon or Linz instead:
      # CODOMO_CITIES: "Granada"
      # skip rooms Codomo marks for the other gender only:
      # CODOMO_GENDER: "female"
      # CODOMO_DASHBOARD_PASSWORD: "pick-one"
    volumes:
      - codomo-data:/data
      # or keep everything in a file instead of the variables above:
      # - ./config.toml:/config/config.toml:ro
    ports:
      # only this machine; set CODOMO_DASHBOARD_PASSWORD before opening it up
      - "127.0.0.1:8080:8080"

volumes:
  codomo-data:
